<svg
  width="100%"
  height="270"
  viewBox="0 0 1350 270"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <!-- Bright orange LED dots -->
    <pattern
      id="ledPattern"
      width="12"
      height="12"
      patternUnits="userSpaceOnUse"
    >
      <circle
        cx="6"
        cy="6"
        r="3.3"
        fill="#ff9d00"
      />
    </pattern>

    <!-- Subtle LED glow -->
    <filter
      id="ledGlow"
      x="-20%"
      y="-50%"
      width="140%"
      height="200%"
    >
      <feGaussianBlur
        stdDeviation="3"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Keep everything inside the display -->
    <clipPath id="displayClip">
      <rect
        x="0"
        y="0"
        width="1350"
        height="270"
      />
    </clipPath>

  </defs>


  <!-- BUS LED DISPLAY -->
  <rect
    x="0"
    y="0"
    width="1350"
    height="270"
    rx="12"
    fill="#080808"
  />


  <!-- TOP PIXELATED LINE -->
  <rect
    x="0"
    y="27"
    width="1350"
    height="12"
    fill="url(#ledPattern)"
  />

  <!-- BOTTOM PIXELATED LINE -->
  <rect
    x="0"
    y="231"
    width="1350"
    height="12"
    fill="url(#ledPattern)"
  />


  <!-- ANIMATED MESSAGE TRACK -->
  <g
    clip-path="url(#displayClip)"
    filter="url(#ledGlow)"
  >

    <g>

      <!-- FIRST MESSAGE -->
      <text
        x="1350"
        y="166.5"
        font-family="Courier New, monospace"
        font-size="117"
        font-weight="bold"
        letter-spacing="6"
        fill="url(#ledPattern)"
      >
        ARRIVING AT
      </text>


      <!-- SECOND MESSAGE -->
      <text
        x="3300"
        y="166.5"
        font-family="Courier New, monospace"
        font-size="117"
        font-weight="bold"
        letter-spacing="6"
        fill="url(#ledPattern)"
      >
        AUDEMARS ODATO
      </text>


      <!-- ANIMATION -->
      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="-5456.25 0"
        dur="9.72s"
        repeatCount="indefinite"
      />

    </g>

  </g>

</svg>